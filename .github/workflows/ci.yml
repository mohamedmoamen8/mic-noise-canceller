name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build extension bundle
        run: npm run build

      - name: Package zip
        run: node scripts/zip.mjs

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mic-noise-canceller-extension
          path: |
            dist/
            mic-noise-canceller.zip
          retention-days: 14

  release:
    needs: build-and-test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension bundle
        run: npm run build

      - name: Package zip
        run: node scripts/zip.mjs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: mic-noise-canceller.zip
          tag_name: ${{ github.ref_name }}
          name: "Mic Noise Canceller ${{ github.ref_name }}"
          generate_release_notes: true
          fail_on_unmatched_files: true
